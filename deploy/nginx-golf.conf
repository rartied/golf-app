# golf.jbohlen.dev — React SPA + FastAPI backend (golf-api on :8001).
# Fully independent of the MLB site: own server block, own root, own cert, own
# upstream port. The MLB config is never touched.
#
# NOTE: certbot has already added a `listen 443 ssl` block + HTTP->HTTPS redirect
# to the installed copy of this file. When updating the live config, re-apply the
# /api/ proxy block below inside the existing server block and reload nginx; or
# re-run `sudo certbot --nginx -d golf.jbohlen.dev` after replacing it.

server {
    server_tokens off;

    listen 80;
    listen [::]:80;
    server_name golf.jbohlen.dev;

    root /opt/golf/repo/dist;
    index index.html;

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
